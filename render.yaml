# Render Blueprint for the Flockline static website.
# The project builds the Vite frontend into dist/public.
services:
  - type: web
    name: poultry-farm-mvp-site
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist/public
    previews:
      generation: automatic
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
